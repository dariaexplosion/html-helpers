<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Story Points</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .input-wrapper {
            flex: 1;
            min-width: 120px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 13px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .time-inputs {
            display: flex;
            gap: 12px;
        }

        .time-inputs .input-wrapper {
            flex: 1;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 24px;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .tasks-list {
            margin-top: 24px;
        }

        .task-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .task-item:hover {
            background: #f0f1f3;
        }

        .task-info {
            flex: 1;
        }

        .task-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .task-time {
            color: #666;
            font-size: 13px;
        }

        .task-sp {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
            margin-right: 12px;
        }

        .delete-btn {
            background: #ff4757;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            padding: 0;
            margin: 0;
        }

        .delete-btn:hover {
            background: #ee5a6f;
            transform: scale(1.1);
        }

        .summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            border-radius: 12px;
            margin-top: 24px;
            text-align: center;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .summary-row:last-child {
            margin-bottom: 0;
            padding-top: 12px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
        }

        .summary-label {
            font-size: 15px;
            opacity: 0.9;
        }

        .summary-value {
            font-size: 24px;
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 15px;
        }

        .quick-buttons {
            margin-bottom: 20px;
        }

        .button-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .quick-btn {
            background: #f0f1f3;
            color: #333;
            border: 2px solid #e0e0e0;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0;
        }

        .quick-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(0);
            box-shadow: none;
        }

        .quick-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .reset-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0;
            white-space: nowrap;
        }

        .reset-btn:hover {
            background: #ee5a6f;
            transform: translateY(0);
            box-shadow: none;
        }

        .duration-section {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .duration-section label {
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .result-box {
            margin-top: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 24px;
            color: white;
        }

        .result-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            opacity: 0.9;
        }

        .result-content {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-highlight {
            padding-top: 16px;
            margin-top: 8px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
        }

        .result-label {
            font-size: 15px;
            opacity: 0.9;
        }

        .result-value {
            font-size: 18px;
            font-weight: 700;
        }

        .result-highlight .result-value {
            font-size: 28px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Калькулятор Story Points</h1>
        <p class="subtitle">1 Story Point = 15 минут работы</p>

        <div class="quick-buttons" id="quickTimeSection">
            <label style="display: block; margin-bottom: 8px;">Быстрый выбор времени:</label>
            <div class="button-row">
                <button class="quick-btn" onclick="addQuickTime(0, 5)">+ 5 мин</button>
                <button class="quick-btn" onclick="addQuickTime(0, 10)">+ 10 мин</button>
                <button class="quick-btn" onclick="addQuickTime(0, 30)">+ 30 мин</button>
                <button class="quick-btn" onclick="addQuickTime(1, 0)">+ 1 час</button>
                <button class="quick-btn" onclick="addQuickTime(2, 0)">+ 2 часа</button>
            </div>
        </div>

        <div class="input-group" id="mainTimeSection">
            <div class="input-wrapper">
                <label for="hours">Часы</label>
                <input type="number" id="hours" min="0" value="0" placeholder="0">
            </div>
            <div class="input-wrapper">
                <label for="minutes">Минуты</label>
                <input type="number" id="minutes" min="0" max="59" value="0" placeholder="0">
            </div>
            <div class="input-wrapper" style="display: flex; align-items: flex-end;">
                <button class="reset-btn" onclick="resetTime()">🔄 Сброс</button>
            </div>
        </div>

        <div class="duration-section">
            <label>Длительность задачи:</label>
            <select id="durationSelect" onchange="handleDurationChange()">
                <option value="single">Разовая задача</option>
                <option value="1day">1 день</option>
                <option value="days">Несколько дней</option>
                <option value="1week">1 неделя (5 рабочих дней)</option>
                <option value="weeks">Несколько недель</option>
                <option value="1month">1 месяц (~20 рабочих дней)</option>
                <option value="months">Несколько месяцев</option>
            </select>

            <div id="customDaysInput" style="display: none; margin-top: 12px;">
                <label for="customDays">Количество дней:</label>
                <input type="number" id="customDays" min="1" value="1" placeholder="Укажите количество дней">
            </div>

            <div id="customWeeksInput" style="display: none; margin-top: 12px;">
                <label for="customWeeks">Количество недель:</label>
                <input type="number" id="customWeeks" min="1" value="1" placeholder="Укажите количество недель">
            </div>

            <div id="customMonthsInput" style="display: none; margin-top: 12px;">
                <label for="customMonths">Количество месяцев:</label>
                <input type="number" id="customMonths" min="1" value="1" placeholder="Укажите количество месяцев">
            </div>

            <div id="dailyTimeInput" style="display: none; margin-top: 12px;">
                <label>Сколько времени в день тратите на задачу?</label>
                <div class="button-row" style="margin-top: 8px; margin-bottom: 12px;">
                    <button class="quick-btn" onclick="addDailyTime(0, 15)">+ 15 мин</button>
                    <button class="quick-btn" onclick="addDailyTime(0, 30)">+ 30 мин</button>
                    <button class="quick-btn" onclick="addDailyTime(1, 0)">+ 1 час</button>
                    <button class="quick-btn" onclick="addDailyTime(2, 0)">+ 2 часа</button>
                    <button class="quick-btn" onclick="addDailyTime(4, 0)">+ 4 часа</button>
                </div>
                <div class="input-group" style="margin-top: 8px;">
                    <div class="input-wrapper">
                        <label for="dailyHours">Часы в день</label>
                        <input type="number" id="dailyHours" min="0" value="0" placeholder="0">
                    </div>
                    <div class="input-wrapper">
                        <label for="dailyMinutes">Минуты в день</label>
                        <input type="number" id="dailyMinutes" min="0" max="59" value="0" placeholder="0">
                    </div>
                    <div class="input-wrapper" style="display: flex; align-items: flex-end;">
                        <button class="reset-btn" onclick="resetDailyTime()">🔄 Сброс</button>
                    </div>
                </div>
            </div>
        </div>

        <button onclick="calculateStoryPoints()">🔢 Рассчитать Story Points</button>

        <div class="result-box" id="resultBox" style="display: none;">
            <div class="result-title">Результат расчета:</div>
            <div class="result-content">
                <div class="result-row">
                    <span class="result-label">Общее время:</span>
                    <span class="result-value" id="resultTime"></span>
                </div>
                <div class="result-row result-highlight">
                    <span class="result-label">Story Points:</span>
                    <span class="result-value" id="resultSP"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addQuickTime(hours, minutes) {
            const currentHours = parseInt(document.getElementById('hours').value) || 0;
            const currentMinutes = parseInt(document.getElementById('minutes').value) || 0;
            
            let totalMinutes = (currentHours * 60 + currentMinutes) + (hours * 60 + minutes);
            let newHours = Math.floor(totalMinutes / 60);
            let newMinutes = totalMinutes % 60;
            
            document.getElementById('hours').value = newHours;
            document.getElementById('minutes').value = newMinutes;
        }

        function addDailyTime(hours, minutes) {
            const currentHours = parseInt(document.getElementById('dailyHours').value) || 0;
            const currentMinutes = parseInt(document.getElementById('dailyMinutes').value) || 0;
            
            let totalMinutes = (currentHours * 60 + currentMinutes) + (hours * 60 + minutes);
            let newHours = Math.floor(totalMinutes / 60);
            let newMinutes = totalMinutes % 60;
            
            document.getElementById('dailyHours').value = newHours;
            document.getElementById('dailyMinutes').value = newMinutes;
        }

        function resetTime() {
            document.getElementById('hours').value = 0;
            document.getElementById('minutes').value = 0;
        }

        function resetDailyTime() {
            document.getElementById('dailyHours').value = 0;
            document.getElementById('dailyMinutes').value = 0;
        }

        function handleDurationChange() {
            const durationType = document.getElementById('durationSelect').value;
            
            // Скрываем все дополнительные поля
            document.getElementById('customDaysInput').style.display = 'none';
            document.getElementById('customWeeksInput').style.display = 'none';
            document.getElementById('customMonthsInput').style.display = 'none';
            document.getElementById('dailyTimeInput').style.display = 'none';
            
            // Управляем видимостью верхнего блока времени
            const quickTimeSection = document.getElementById('quickTimeSection');
            const mainTimeSection = document.getElementById('mainTimeSection');

            // Показываем нужные поля в зависимости от выбора
            if (durationType === 'single') {
                // Разовая задача - показываем верхний блок времени
                quickTimeSection.style.display = 'block';
                mainTimeSection.style.display = 'flex';
            } else {
                // Длительная задача - скрываем верхний блок времени
                quickTimeSection.style.display = 'none';
                mainTimeSection.style.display = 'none';
                
                // Показываем поле для ежедневного времени
                document.getElementById('dailyTimeInput').style.display = 'block';
                
                // Показываем дополнительные поля в зависимости от типа
                if (durationType === 'days') {
                    document.getElementById('customDaysInput').style.display = 'block';
                } else if (durationType === 'weeks') {
                    document.getElementById('customWeeksInput').style.display = 'block';
                } else if (durationType === 'months') {
                    document.getElementById('customMonthsInput').style.display = 'block';
                }
            }
        }

        function calculateTotalMinutes() {
            const durationType = document.getElementById('durationSelect').value;
            
            if (durationType === 'single') {
                // Разовая задача - берем просто часы и минуты
                const hours = parseInt(document.getElementById('hours').value) || 0;
                const minutes = parseInt(document.getElementById('minutes').value) || 0;
                return hours * 60 + minutes;
            } else {
                // Длительная задача - считаем по дням
                let totalDays = 0;
                
                if (durationType === '1day') {
                    totalDays = 1;
                } else if (durationType === 'days') {
                    totalDays = parseInt(document.getElementById('customDays').value) || 0;
                } else if (durationType === '1week') {
                    totalDays = 5; // 5 рабочих дней
                } else if (durationType === 'weeks') {
                    const weeks = parseInt(document.getElementById('customWeeks').value) || 0;
                    totalDays = weeks * 5; // 5 рабочих дней в неделю
                } else if (durationType === '1month') {
                    totalDays = 20; // ~20 рабочих дней
                } else if (durationType === 'months') {
                    const months = parseInt(document.getElementById('customMonths').value) || 0;
                    totalDays = months * 20; // ~20 рабочих дней в месяц
                }

                const dailyHours = parseInt(document.getElementById('dailyHours').value) || 0;
                const dailyMinutes = parseInt(document.getElementById('dailyMinutes').value) || 0;
                const dailyTotalMinutes = dailyHours * 60 + dailyMinutes;
                
                return totalDays * dailyTotalMinutes;
            }
        }

        function calculateStoryPoints() {
            const totalMinutes = calculateTotalMinutes();

            if (totalMinutes === 0) {
                alert('Укажите время');
                return;
            }

            const storyPoints = Math.round(totalMinutes / 15 * 10) / 10;
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;

            // Показываем результат
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('resultTime').textContent = `${hours}ч ${minutes}м`;
            document.getElementById('resultSP').textContent = `${storyPoints} SP`;

            // Прокручиваем к результату
            document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Обработка Enter для расчета
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateStoryPoints();
            }
        });
    </script>
</body>
</html>
