<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор тем писем</title>
    <style>
        :root{
            --page:#EFE7D6; --ink:#2A1E0E; --ink-soft:#6b5c44;
            --cream:#EDE2C4; --cream-edge:#B9A97D;
            --rust:#C9642F; --rust-edge:#8F3E17; --rust-ink:#FBEEE0;
            --moss:#7C9A56; --moss-edge:#516A34;
            --panel:#FAF3E1; --panel-edge:#DCCDA0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Trebuchet MS', Verdana, sans-serif;
            background: var(--page);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid var(--panel-edge);
            border-radius: 20px;
            box-shadow: 0 6px 0 var(--panel-edge), 0 16px 30px rgba(60,40,10,0.15);
            padding: 30px;
        }
        
        h1 {
            color: var(--ink);
            margin-bottom: 10px;
            font-size: 25px;
            font-weight: bold;
        }
        
        .subtitle {
            color: var(--ink-soft);
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--rust);
            border-radius: 2px;
        }
        
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .btn {
            padding: 9px 16px;
            border: 2px solid var(--cream-edge);
            background: var(--cream);
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.12s ease-out;
            color: var(--ink);
            box-shadow: 0 3px 0 var(--cream-edge);
            transform: translateY(0);
        }
        
        .btn:hover {
            border-color: var(--rust-edge);
            background: #F3D9C6;
            transform: translateY(-1px);
            box-shadow: 0 4px 0 var(--cream-edge);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--cream-edge);
        }
        
        .btn.active {
            background: var(--rust);
            color: var(--rust-ink);
            border-color: var(--rust-edge);
            box-shadow: 0 3px 0 var(--rust-edge);
        }
        
        .btn.asap {
            border-color: #9C4E2C;
        }
        
        .btn.asap:hover {
            border-color: #9C4E2C;
            background: #F0D2C4;
        }
        
        .btn.asap.active {
            background: #9C4E2C;
            color: #FBEEE0;
            border-color: #6E3319;
            box-shadow: 0 3px 0 #6E3319;
        }
        
        .btn-with-tooltip {
            position: relative;
        }
        
        .btn-with-tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ink);
            color: #F4ECD8;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            margin-bottom: 5px;
            z-index: 1000;
        }
        
        .btn-with-tooltip:hover::after {
            opacity: 1;
        }
        
        .result-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid var(--cream-edge);
        }
        
        .result-box {
            background: var(--cream);
            border: 2px solid var(--cream-edge);
            border-radius: 12px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            min-height: 60px;
            color: var(--ink);
            word-break: break-word;
        }
        
        .result-box.empty {
            color: var(--ink-soft);
            font-style: italic;
        }
        
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            align-items: center;
        }
        
        .action-btn {
            padding: 11px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            transform: translateY(0);
            transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
        }
        
        .copy-btn {
            background: var(--rust);
            color: var(--rust-ink);
            box-shadow: 0 4px 0 var(--rust-edge);
        }
        
        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--rust-edge);
        }
        .copy-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--rust-edge);
        }
        
        .clear-btn {
            background: var(--cream);
            color: var(--ink);
            box-shadow: 0 4px 0 var(--cream-edge);
        }
        
        .clear-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--cream-edge);
        }
        .clear-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--cream-edge);
        }
        
        .copied-message {
            display: none;
            color: var(--moss-edge);
            font-size: 14px;
            font-weight: 600;
            align-items: center;
            gap: 5px;
        }
        
        .copied-message.show {
            display: flex;
        }

        input[type="text"] {
            border: 2px solid var(--cream-edge) !important;
            background: var(--cream) !important;
            color: var(--ink) !important;
            border-radius: 10px !important;
            font-family: inherit;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--rust-edge) !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Генератор тем писем</h1>
        <p class="subtitle">Нажимай на кнопки, чтобы собрать шаблон темы письма</p>
        
        <!-- ID ЗАКАЗА -->
        <div class="section">
            <div class="section-title">ID заказа (ОБЯЗАТЕЛЬНО)</div>
            <input type="text" id="orderId" placeholder="Введи ID заказа" style="padding: 8px 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 14px; width: 250px;">
        </div>
        
        <!-- ПОДРЯДЧИКИ - РЕДАКТИРУЙ ЗДЕСЬ -->
        <!-- ПОДРЯДЧИКИ - РЕДАКТИРУЙ ЗДЕСЬ -->
        <div class="section">
            <div class="section-title">Подрядчик</div>
            <div class="buttons" id="contractors">
                <button class="btn" data-type="contractor" data-value="JanusWW">JanusWW</button>
                <button class="btn" data-type="contractor" data-value="LogrusIT">LogrusIT</button>
                <button class="btn" data-type="contractor" data-value="LogrusGlobal">LogrusGlobal</button>
                <button class="btn" data-type="contractor" data-value="MTA">MTA</button>
                <button class="btn" data-type="contractor" data-value="Бюро">Бюро</button>
                <button class="btn" data-type="contractor" data-value="ЭГО Транслейтинг">ЭГО Транслейтинг</button>
            </div>
        </div>
        
        <!-- СРОЧНОСТЬ -->
        <div class="section">
            <div class="section-title">Срочность (необязательно)</div>
            <div class="buttons">
                <button class="btn asap" data-type="asap" data-value="ASAP">ASAP</button>
            </div>
        </div>
        
        <!-- ЯЗЫКИ - РЕДАКТИРУЙ ЗДЕСЬ -->
        <div class="section">
            <div class="section-title">Языки (можно несколько)</div>
            <div class="buttons" id="languages">
                <button class="btn" data-type="language" data-value="az">Азербайджанский</button>
                <button class="btn" data-type="language" data-value="am">Амхарский</button>
                <button class="btn" data-type="language" data-value="en">Английский</button>
                <button class="btn" data-type="language" data-value="ar">Арабский</button>
                <button class="btn" data-type="language" data-value="hy">Армянский</button>
                <button class="btn" data-type="language" data-value="be">Белорусский</button>
                <button class="btn" data-type="language" data-value="ka">Грузинский</button>
                <button class="btn" data-type="language" data-value="kk_сyr">Казахский (кириллица)</button>
                <button class="btn" data-type="language" data-value="kk_lat">Казахский (латиница)</button>
                <button class="btn" data-type="language" data-value="zhs">Китайский (упрощенный)</button>
                <button class="btn" data-type="language" data-value="ko">Корейский</button>
                <button class="btn" data-type="language" data-value="ky">Кыргызский</button>
                <button class="btn" data-type="language" data-value="tg">Таджикский</button>
                <button class="btn" data-type="language" data-value="tr">Турецкий</button>
                <button class="btn" data-type="language" data-value="ru">Русский</button>
                <button class="btn" data-type="language" data-value="uz">Узбекский</button>
                <button class="btn" data-type="language" data-value="fr">Французский</button>
            </div>
        </div>
        
        <!-- ПРОДУКТЫ - РЕДАКТИРУЙ ЗДЕСЬ -->
        <div class="section">
            <div class="section-title">Продукт</div>
            <div class="buttons" id="products">
                <button class="btn" data-type="product" data-value="Межнар">Межнар</button>
                <button class="btn" data-type="product" data-value="Инфобез">Инфобез</button>
                <button class="btn btn-with-tooltip" data-type="product" data-value="Маркетинг" data-tooltip="В письме будет: Маркетинг">Магазинка Пуши и коммуникации: Маркетинг</button>
                <button class="btn" data-type="product" data-value="Магазинка">Магазинка</button>
                <button class="btn" data-type="product" data-value="ПВЗ">ПВЗ</button>
                <button class="btn btn-with-tooltip" data-type="product" data-value="Поддержка" data-tooltip="⚠️ Уточни конкретный продукт">Поддержка</button>
                <button class="btn" data-type="product" data-value="Поддержка Покупатели">Поддержка Покупатели</button>
                <button class="btn" data-type="product" data-value="Поддержка Продавцы">Поддержка Продавцы</button>
                <button class="btn" data-type="product" data-value="Поддержка Склады">Поддержка Склады</button>
                <button class="btn" data-type="product" data-value="Поддержка Банк">Поддержка Банк</button>
                <button class="btn" data-type="product" data-value="Поддержка ЦА">Поддержка ЦА</button>
                <button class="btn" data-type="product" data-value="WBP">WBP</button>
                <button class="btn" data-type="product" data-value="WBP Контент">WBP Контент</button>
                <button class="btn" data-type="product" data-value="WB ID">WB ID</button>
                <button class="btn" data-type="product" data-value="WB Flot">WB Flot</button>
                <button class="btn" data-type="product" data-value="Логобъекты WBWH">Логобъекты WBWH</button>
                <button class="btn" data-type="product" data-value="WB Такси">WB Такси</button>
                <button class="btn" data-type="product" data-value="Логобъекты WB Job">Логобъекты WB Job</button>
                <button class="btn" data-type="product" data-value="Логобъекты Логистика">Логобъекты Логистика</button>
                <button class="btn" data-type="product" data-value="Локализация">Локализация</button>
            </div>
            <div style="margin-top: 10px;">
                <input type="text" id="customProduct" placeholder="Или введи свой продукт" style="padding: 8px 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 14px; width: 250px;">
                <button class="btn" id="addCustomProduct" style="margin-left: 8px;">Добавить</button>
            </div>
        </div>
        
        <!-- РЕЗУЛЬТАТ -->
        <div class="result-section">
            <div class="section-title">Результат</div>
            <div class="result-box empty" id="result">Выбери параметры выше</div>
            
            <!-- СПИСОК ЯЗЫКОВ -->
            <div id="languageListSection" style="display: none; margin-top: 15px;">
                <div style="font-size: 14px; font-weight: 600; color: #444; margin-bottom: 8px;">Список языков:</div>
                <div id="languageList" style="background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 8px; padding: 15px; font-size: 14px; color: #333;"></div>
            </div>
            
            <div class="actions">
                <button class="action-btn copy-btn" id="copyBtn">Скопировать</button>
                <button class="action-btn copy-btn" id="copyLanguagesBtn" style="display: none;">Скопировать языки</button>
                <button class="action-btn clear-btn" id="clearBtn">Очистить</button>
                <div class="copied-message" id="copiedMsg">✓ Скопировано!</div>
            </div>
        </div>
    </div>

    <script>
        const languageNames = {
            'az': 'азербайджанский',
            'am': 'амхарский',
            'en': 'английский',
            'ar': 'арабский',
            'hy': 'армянский',
            'be': 'белорусский',
            'ka': 'грузинский',
            'kk_сyr': 'казахский (кириллица)',
            'kk_lat': 'казахский (латиница)',
            'zhs': 'китайский (упрощенный)',
            'ko': 'корейский',
            'ky': 'кыргызский',
            'tg': 'таджикский',
            'tr': 'турецкий',
            'ru': 'русский',
            'uz': 'узбекский',
            'fr': 'французский'
        };
        
        const state = {
            orderId: '',
            contractor: '',
            asap: false,
            languages: [],
            product: ''
        };

        function updateResult() {
            const resultBox = document.getElementById('result');
            const languageListSection = document.getElementById('languageListSection');
            const languageList = document.getElementById('languageList');
            const copyLanguagesBtn = document.getElementById('copyLanguagesBtn');
            
            if (!state.orderId && !state.contractor && state.languages.length === 0 && !state.product && !state.asap) {
                resultBox.className = 'result-box empty';
                resultBox.textContent = 'Выбери параметры выше';
                languageListSection.style.display = 'none';
                copyLanguagesBtn.style.display = 'none';
                return;
            }
            
            let parts = [];
            
            if (state.orderId) {
                parts.push(`[${state.orderId}]`);
            }
            
            if (state.contractor) {
                parts.push(`[${state.contractor}]`);
            }
            
            if (state.asap) {
                parts.push('[ASAP]');
            }
            
            state.languages.forEach(lang => {
                parts.push(`[${lang}]`);
            });
            
            if (state.product) {
                parts.push(`[${state.product}]`);
            }
            
            parts.push(' ');
            
            resultBox.className = 'result-box';
            resultBox.textContent = parts.join('');
            
            // Update language list
            if (state.languages.length > 0) {
                const langNames = state.languages.map(code => languageNames[code] || code);
                languageList.textContent = langNames.join(', ');
                languageListSection.style.display = 'block';
                copyLanguagesBtn.style.display = 'inline-block';
            } else {
                languageListSection.style.display = 'none';
                copyLanguagesBtn.style.display = 'none';
            }
        }

        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const type = this.dataset.type;
                const value = this.dataset.value;
                
                if (type === 'contractor') {
                    document.querySelectorAll('[data-type="contractor"]').forEach(b => b.classList.remove('active'));
                    this.classList.toggle('active');
                    state.contractor = this.classList.contains('active') ? value : '';
                }
                else if (type === 'asap') {
                    this.classList.toggle('active');
                    state.asap = this.classList.contains('active');
                }
                else if (type === 'language') {
                    this.classList.toggle('active');
                    if (this.classList.contains('active')) {
                        state.languages.push(value);
                    } else {
                        state.languages = state.languages.filter(l => l !== value);
                    }
                }
                else if (type === 'product') {
                    document.querySelectorAll('[data-type="product"]').forEach(b => b.classList.remove('active'));
                    this.classList.toggle('active');
                    state.product = this.classList.contains('active') ? value : '';
                }
                
                updateResult();
            });
        });

        document.getElementById('copyBtn').addEventListener('click', function() {
            const resultText = document.getElementById('result').textContent;
            if (resultText && resultText !== 'Выбери параметры выше') {
                navigator.clipboard.writeText(resultText).then(() => {
                    const msg = document.getElementById('copiedMsg');
                    msg.classList.add('show');
                    setTimeout(() => msg.classList.remove('show'), 2000);
                });
            }
        });

        document.getElementById('copyLanguagesBtn').addEventListener('click', function() {
            const languageListText = document.getElementById('languageList').textContent;
            if (languageListText) {
                navigator.clipboard.writeText(languageListText).then(() => {
                    const msg = document.getElementById('copiedMsg');
                    msg.classList.add('show');
                    setTimeout(() => msg.classList.remove('show'), 2000);
                });
            }
        });

        document.getElementById('clearBtn').addEventListener('click', function() {
            state.orderId = '';
            state.contractor = '';
            state.asap = false;
            state.languages = [];
            state.product = '';
            
            document.getElementById('orderId').value = '';
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            updateResult();
        });

        document.getElementById('orderId').addEventListener('input', function(e) {
            state.orderId = e.target.value.trim();
            updateResult();
        });

        document.getElementById('addCustomProduct').addEventListener('click', function() {
            const input = document.getElementById('customProduct');
            const value = input.value.trim();
            
            if (value) {
                document.querySelectorAll('[data-type="product"]').forEach(b => b.classList.remove('active'));
                state.product = value;
                input.value = '';
                updateResult();
            }
        });

        document.getElementById('customProduct').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('addCustomProduct').click();
            }
        });
    </script>
</body>
</html>
